name: app_dzikir_pagi_petang
description: "Dzikir Pagi & Petang - Panduan dzikir lengkap dengan fitur Islam."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.4.2
  path: ^1.9.1

  # Location
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  flutter_compass: ^0.8.0

  # Islamic features
  adhan: ^2.0.0
  hijri: ^3.0.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  vibration: ^2.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_launcher_padded.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground_padded.png"

flutter:
  uses-material-design: true

  assets:
    - logo.png
    - logo.svg
    - assets/audio/
    - assets/images/

  fonts:
    - family: Cascadia Mono
      fonts:
        - asset: assets/fonts/CascadiaMono-Regular.ttf
        - asset: assets/fonts/CascadiaMono-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#303841"
  image: "logo.png"
  android_12:
    color: "#ffffff"
    color_dark: "#303841"
    image: "logo.png"
